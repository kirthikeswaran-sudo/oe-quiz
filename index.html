<div class="header">

  </div>

  <!-- Result -->
  <div id="result-screen">
    <div class="result-card">
      <div class="big-score" id="big-score"></div>
      <div class="grade" id="grade-text"></div>

        <button class="btn-review" onclick="showReview()">📋 Review Answers</button>
        <button class="btn-new" onclick="newQuiz()">🏠 New Quiz</button>
      </div>
    </div>
  </div>

  <!-- Review -->
  <div id="review-screen">
    <button class="back-btn" onclick="backToResult()">← Back to Results</button>
    <div id="review-list"></div>
  </div>
</div>

const TOPICS = ["Energy Sources","Solar Energy","Wind Energy","Biomass & Biogas","Other Renewables"];
let selectedTopics = [...TOPICS];
let quizQuestions = [];
let currentIdx = 0;
let score = 0;
let answered = 0;
let userAnswers = [];

// Build topic buttons
const topicContainer = document.getElementById('topic-container');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'topic-btn active';
  btn.textContent = t;
  btn.dataset.topic = t;
  btn.onclick = () => toggleTopic(t, btn);
  topicContainer.appendChild(btn);
});

function toggleTopic(t, btn) {
  if (selectedTopics.includes(t)) {
    if (selectedTopics.length === 1) return;
    selectedTopics = selectedTopics.filter(x => x !== t);
    btn.classList.remove('active');
  } else {
    selectedTopics.push(t);
    btn.classList.add('active');
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz() {
  const count = parseInt(document.getElementById('q-count').value);
  let pool = ALL_QUESTIONS.filter(q => selectedTopics.includes(q.t));
  shuffle(pool);
  quizQuestions = pool.slice(0, Math.min(count, pool.length));
  currentIdx = 0; score = 0; answered = 0; userAnswers = [];
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = quizQuestions[currentIdx];
  const total = quizQuestions.length;
  document.getElementById('q-counter').textContent = `Q ${currentIdx + 1} / ${total}`;
  document.getElementById('live-score').textContent = score;
  document.getElementById('prog-bar').style.width = `${(currentIdx / total) * 100}%`;
  document.getElementById('q-num-label').textContent = `${q.t} • Question ${currentIdx + 1}`;
  document.getElementById('q-text').textContent = q.q;

  const wrap = document.getElementById('options-wrap');
  wrap.innerHTML = '';
  const labels = ['A','B','C','D'];
  q.a.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="label">${labels[i]}</span><span>${opt}</span>`;
    btn.onclick = () => selectAnswer(i);
    wrap.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = '';
  document.getElementById('next-btn').style.display = 'none';
}

function selectAnswer(chosen) {
  const q = quizQuestions[currentIdx];
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');

  userAnswers.push({ q: q.q, chosen, correct: q.c, opts: q.a });

  if (chosen === q.c) {
    score++;
    btns[chosen].classList.add('correct');
    fb.textContent = '✅ Correct!';
    fb.className = 'feedback show correct-fb';
  } else {
    btns[chosen].classList.add('wrong');
    btns[q.c].classList.add('correct');
    fb.textContent = `❌ Wrong. Correct answer: ${q.a[q.c]}`;
    fb.className = 'feedback show wrong-fb';
  }
  document.getElementById('live-score').textContent = score;
  answered++;
  document.getElementById('next-btn').style.display = 'inline-block';
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= quizQuestions.length) showResult();
  else renderQuestion();
}

function showResult() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  const total = quizQuestions.length;
  const pct = Math.round((score / total) * 100);
  document.getElementById('big-score').innerHTML = `${score}<span>/${total}</span>`;
  document.getElementById('r-correct').textContent = score;
  document.getElementById('r-wrong').textContent = total - score;
  document.getElementById('r-pct').textContent = pct + '%';
  let grade = pct >= 90 ? '🏆 Excellent!' : pct >= 75 ? '🎯 Good Job!' : pct >= 50 ? '📚 Keep Practicing!' : '💪 Study More!';
  document.getElementById('grade-text').textContent = grade;
  document.getElementById('prog-bar').style.width = '100%';
}

function retryQuiz() {
  document.getElementById('result-screen').style.display = 'none';
  currentIdx = 0; score = 0; answered = 0; userAnswers = [];
  shuffle(quizQuestions);
  document.getElementById('quiz-screen').style.display = 'block';
  renderQuestion();
}

function showReview() {
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('review-screen').style.display = 'block';
  const list = document.getElementById('review-list');
  list.innerHTML = '';
  const labels = ['A','B','C','D'];
  userAnswers.forEach((ua, i) => {
    const div = document.createElement('div');
    div.className = 'review-item';
    const status = ua.chosen === ua.correct ? '✅' : '❌';
    div.innerHTML = `<div class="q-text">${status} Q${i+1}. ${ua.q}</div>
      ${ua.chosen !== ua.correct ? `<div class="review-ans rev-wrong">Your answer: ${labels[ua.chosen]}. ${ua.opts[ua.chosen]}</div>` : ''}
      <div class="review-ans rev-correct">Correct: ${labels[ua.correct]}. ${ua.opts[ua.correct]}</div>`;
    list.appendChild(div);
  });
}

function backToResult() {
  document.getElementById('review-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
}

function newQuiz() {
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'block';
}
</script>
